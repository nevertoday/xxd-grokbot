<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="A chat AI: It replies. The rest is still on you. Your Grok Bot: On its cloud computer, it gets it done."><style>@keyframes ask{0%,3.00%{opacity:0;transform:translateY(6px)}7.00%,92.00%{opacity:1;transform:translateY(0)}97.00%,100%{opacity:0}}.ask{animation:ask 10.0s infinite;transform-box:fill-box}@keyframes reply{0%,12.00%{opacity:0;transform:translateY(6px)}17.00%,92.00%{opacity:1;transform:translateY(0)}97.00%,100%{opacity:0}}.reply{animation:reply 10.0s infinite;transform-box:fill-box}@keyframes st0{0%,24.00%{opacity:0;transform:translateY(6px)}28.00%,92.00%{opacity:1;transform:translateY(0)}97.00%,100%{opacity:0}}.st0{animation:st0 10.0s infinite;transform-box:fill-box}@keyframes st1{0%,36.00%{opacity:0;transform:translateY(6px)}40.00%,92.00%{opacity:1;transform:translateY(0)}97.00%,100%{opacity:0}}.st1{animation:st1 10.0s infinite;transform-box:fill-box}@keyframes st2{0%,48.00%{opacity:0;transform:translateY(6px)}52.00%,92.00%{opacity:1;transform:translateY(0)}97.00%,100%{opacity:0}}.st2{animation:st2 10.0s infinite;transform-box:fill-box}@keyframes st3{0%,60.00%{opacity:0;transform:translateY(6px)}64.00%,92.00%{opacity:1;transform:translateY(0)}97.00%,100%{opacity:0}}.st3{animation:st3 10.0s infinite;transform-box:fill-box}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style><rect width="1200" height="440" fill="#171612"/><rect x="40" y="40" width="540" height="300" fill="#211f1a" stroke="#3a372f" stroke-width="2"/><text x="64" y="82" font-family="'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#f3f0ea" text-anchor="start">A chat AI</text><g class="ask"><rect x="161" y="104" width="395" height="48" fill="#f3f0ea"/><text x="179" y="135" font-family="'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#171612" text-anchor="start">Turn this week&#x27;s progress into slides</text></g><g class="reply"><rect x="64" y="170" width="380" height="118" fill="#171612" stroke="#3a372f" stroke-width="2"/><text x="82" y="200" font-family="'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#f3f0ea" text-anchor="start">Sure, here&#x27;s an outline:</text><text x="82" y="232" font-family="'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#f3f0ea" text-anchor="start">1. Done this week  2. Problems</text><text x="82" y="264" font-family="'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#f3f0ea" text-anchor="start">3. Next week…</text></g><text x="310" y="384" font-family="'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#a7a194" text-anchor="middle">It replies. The rest is still on you.</text><text x="600" y="200" font-family="ui-monospace,Menlo,monospace" font-size="26" font-weight="700" fill="#a7a194" text-anchor="middle">vs</text><rect x="620" y="40" width="540" height="300" fill="#211f1a" stroke="#ff7a4d" stroke-width="2"/><rect x="644" y="58" width="30" height="30" fill="#f3f0ea"/><rect x="651.5" y="67.0" width="4.5" height="4.5" fill="#171612"/><rect x="662.0" y="67.0" width="4.5" height="4.5" fill="#171612"/><rect x="651.5" y="76.8" width="15.0" height="3.0" fill="#ff7a4d"/><text x="686" y="82" font-family="'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#f3f0ea" text-anchor="start">Your Grok Bot</text><g class="st0"><rect x="644" y="112" width="30" height="30" fill="#ff7a4d"/><path d="M651 127 l6 6 l11 -12" stroke="#171612" stroke-width="3.5" fill="none"/><text x="690" y="135" font-family="'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#f3f0ea" text-anchor="start">Reads this week&#x27;s email and chat</text></g><g class="st1"><rect x="644" y="166" width="30" height="30" fill="#ff7a4d"/><path d="M651 181 l6 6 l11 -12" stroke="#171612" stroke-width="3.5" fill="none"/><text x="690" y="189" font-family="'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#f3f0ea" text-anchor="start">Checks numbers against the sheet</text></g><g class="st2"><rect x="644" y="220" width="30" height="30" fill="#ff7a4d"/><path d="M651 235 l6 6 l11 -12" stroke="#171612" stroke-width="3.5" fill="none"/><text x="690" y="243" font-family="'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#f3f0ea" text-anchor="start">Saves the slides to the shared folder</text></g><g class="st3"><rect x="644" y="274" width="30" height="30" fill="#ff7a4d"/><path d="M651 289 l6 6 l11 -12" stroke="#171612" stroke-width="3.5" fill="none"/><text x="690" y="297" font-family="'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#f3f0ea" text-anchor="start">Does it again every Friday at 4 PM</text></g><text x="890" y="384" font-family="'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#ff7a4d" text-anchor="middle">On its cloud computer, it gets it done.</text><text x="1160" y="424" font-family="'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a7a194" text-anchor="end">Illustration</text></svg>
